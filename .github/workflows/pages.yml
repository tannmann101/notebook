name: Pages

# Publishes the repository root as the site. Everything here is static, so
# there is nothing to build.

on:
  push:
    branches: [main, claude/admiring-dirac-o1h8yh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow token is allowed to publish to Pages but not to create it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
